name: Actualizar datos deportivos
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar-datos.yml'
      - 'scripts/proveedores.py'
      - 'scripts/construir_datos.py'
      - 'equipos-favoritos.json'
      - 'tests/test_*.py'
permissions:
  contents: write
concurrency:
  group: datos-deportivos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.proveedores
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - run: python -m scripts.construir_datos entrada.json datos.json
      - run: |
          python -c 'import json; d=json.load(open("datos.json")); assert any(len(v)>0 for v in d["ligas"].values()); assert d["favoritos_validados"] is True; assert len(d["equipos_top"])==38; assert "candidatos" in d and "dobles" in d'
          mv entrada.json datos-origen.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json datos-origen.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos deportivos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
