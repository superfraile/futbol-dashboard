name: Pruebas del motor
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar sintaxis de Python
        run: python -m compileall -q scripts tests
      - name: Ejecutar pruebas de selección y validación
        run: python -m unittest discover -s tests -v
      - name: Comprobar sintaxis del dashboard JavaScript
        run: node --check panel.js && node --check seguimiento.js
      - name: Comprobar carga de todas las pestañas con datos reales
        run: node tests/panel_carga.test.cjs
