name: Seguimiento simulado
on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'
    # 20:00 Madrid: 18:00 UTC en verano, 19:00 UTC en invierno.
    # Segunda ejecución de respaldo, sin duplicar el cierre.
    - cron: '0,30 18,19 * * 2'
  push:
    paths:
      - 'scripts/seguimiento.py'
      - '.github/workflows/seguimiento.yml'
permissions:
  contents: write
concurrency:
  group: datos-deportivos
  cancel-in-progress: false
jobs:
  seguimiento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Registrar y liquidar simulación
        env:
          SPORTAPI_API_KEY: ${{ secrets.SPORTAPI_API_KEY }}
        run: python -m scripts.seguimiento
      - name: Publicar seguimiento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seguimiento.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar seguimiento simulado"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
