name: Probar conexión MoviOdds
on:
  schedule:
    - cron: '13 7,11,15,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar esquema de MoviOdds sin publicar datos sensibles
        env:
          MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
        run: python -m scripts.diagnosticar_moviodds
